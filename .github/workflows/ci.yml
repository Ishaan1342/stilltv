name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[photos,dev]'
      - run: python -m unittest discover -s tests -v
      - run: ruff check src tests tools
      - run: ruff format --check src tests tools
      - run: python tools/public_audit.py
      - run: python -m build
      - run: python tools/wheel_smoke.py

  android:
    name: Android source build and signature check
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /tmp/stilltv-android-sdk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install specified SDK tools
        run: python3 tools/setup_android.py --sdk "$ANDROID_HOME" --accept-licenses
      - run: python3 tools/test_android_logic.py
      - run: python3 tools/build_android.py
      - name: Verify launcher permission boundary
        run: |
          python3 - <<'PY'
          import os, subprocess
          tool = os.path.join(os.environ['ANDROID_HOME'], 'build-tools/34.0.0/aapt2')
          result = subprocess.check_output([tool, 'dump', 'permissions', 'build/android/stilltv.apk'], text=True)
          assert 'uses-permission:' not in result, result
          print('No requested Android permissions in compiled APK')
          PY

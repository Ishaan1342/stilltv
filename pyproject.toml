[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stilltv"
version = "0.1.0"
description = "An offline TV home, with device-bound plans and recoverable Android TV customization."
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Ishaan1342"}]
readme = "README.md"
dependencies = []

[project.optional-dependencies]
photos = ["Pillow>=11.0,<13"]
dev = ["build>=1.2,<2", "ruff>=0.9,<1"]

[project.scripts]
stilltv = "stilltv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E9", "F", "I"]

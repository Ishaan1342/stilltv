    <linearGradient id="shade" x2="0" y2="1"><stop stop-color="#071c24" stop-opacity=".45"/><stop offset=".4" stop-opacity="0"/><stop offset="1" stop-color="#081e24" stop-opacity=".8"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>

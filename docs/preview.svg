    <rect x="1005" y="746" width="119" height="57" rx="9" stroke="#d5efc7" fill="#fff" fill-opacity=".08"/>
    <text x="1490" y="863" text-anchor="end" font-size="11" letter-spacing="2" opacity=".55">STILLTV · DESIGN PREVIEW</text>
